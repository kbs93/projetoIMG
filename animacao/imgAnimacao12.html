<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo Viewport 3D - Three.js</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #image-source-list {
      display: none;
    }
  </style>
</head>
<body>

  <div id="image-source-list"></div>
  <div id="webgl-canvas"></div>

  <!-- Bibliotecas externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    // 1. Variáveis com let
    let textures = [];
    let currentIndex = 0;
    let isAnimating = false;
    let autoPlayTimer = null;
    let currentRotationY = 0;
    const loader = new THREE.TextureLoader();

    // 2. Setup Three.js
    const container = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    const baseDistance = 5.0;
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, baseDistance);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 3. Cálculo para cobrir 100% da viewport
    function calculateViewportSize(distance, cam) {
      const vFov = (cam.fov * Math.PI) / 180;
      const height = 2 * Math.tan(vFov / 2) * distance;
      const width = height * cam.aspect;
      return { width, height };
    }

    let vp = calculateViewportSize(baseDistance, camera);
    let geometry = new THREE.BoxGeometry(vp.width, vp.height, vp.width);

    // 4. Materiais Básicos (Faces com texturas DEVEM ter color: 0xffffff para não ficarem pretas)
    const materials = [
      new THREE.MeshBasicMaterial({ color: 0xffffff }), // Direita (+X)
      new THREE.MeshBasicMaterial({ color: 0x000000 }), // Esquerda (-X)
      new THREE.MeshBasicMaterial({ color: 0x000000 }), // Cima (+Y)
      new THREE.MeshBasicMaterial({ color: 0x000000 }), // Baixo (-Y)
      new THREE.MeshBasicMaterial({ color: 0xffffff }), // Frente (+Z)
      new THREE.MeshBasicMaterial({ color: 0x000000 })  // Fundo (-Z)
    ];

    const cube = new THREE.Mesh(geometry, materials);
    cube.position.z = -vp.width / 2;
    cube.visible = false;
    scene.add(cube);

    // 5. Transição 3D
    function nextSlide() {
      if (isAnimating || !textures.length || textures.length < 2) return;
      isAnimating = true;

      const nextIndex = (currentIndex + 1) % textures.length;
      
      materials[0].map = textures[nextIndex];
      materials[0].needsUpdate = true;

      const timeline = gsap.timeline({
        onComplete: () => {
          materials[4].map = textures[nextIndex];
          materials[4].needsUpdate = true;
          cube.rotation.y = 0;
          currentRotationY = 0;
          currentIndex = nextIndex;
          isAnimating = false;
        }
      });

      timeline.to(cube.rotation, {
        y: currentRotationY - Math.PI / 2,
        duration: 1.8,
        ease: "power3.inOut"
      }, 0);

      const zoomOutDistance = baseDistance + (vp.width * 0.35);

      timeline.to(camera.position, {
        z: zoomOutDistance,
        duration: 0.9,
        ease: "power2.out"
      }, 0);

      timeline.to(camera.position, {
        z: baseDistance,
        duration: 0.9,
        ease: "power2.in"
      }, 0.9);
    }

    // 6. Redimensionamento Responsivo
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      vp = calculateViewportSize(baseDistance, camera);

      cube.geometry.dispose();
      cube.geometry = new THREE.BoxGeometry(vp.width, vp.height, vp.width);
      cube.position.z = -vp.width / 2;
    });

    // 7. Loop de Renderização
    function render() {
      requestAnimationFrame(render);
      if (cube.visible) {
        renderer.render(scene, camera);
      }
    }
    render();

    // --- PADRÃO UNIVERSAL DE RECEBIMENTO DE FOTOS ---
    function aplicarFotos(listaFotos) {
      if (!listaFotos || !listaFotos.length) return;

      const fotosParaUsar = listaFotos.length === 1 ? [listaFotos[0], listaFotos[0]] : listaFotos;

      textures = fotosParaUsar.map(url => {
        const tex = loader.load(url);
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        return tex;
      });

      currentIndex = 0;
      isAnimating = false;

      materials[4].color.setHex(0xffffff);
      materials[4].map = textures[0];
      materials[4].needsUpdate = true;

      materials[0].color.setHex(0xffffff);
      materials[0].map = textures[1] || textures[0];
      materials[0].needsUpdate = true;

      cube.visible = true;

      clearInterval(autoPlayTimer);
      if (textures.length > 1) {
        autoPlayTimer = setInterval(nextSlide, 3000);
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.tipo === 'CARREGAR_FOTOS') {
        aplicarFotos(event.data.fotos);
      }
    });

    window.atualizarTexturas = function(novosLinks) {
      aplicarFotos(novosLinks);
    };

    window.parent.postMessage({ tipo: 'IFRAME_PRONTO' }, '*');
  </script>
</body>
</html>
