<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caleidoscópio de Cristal 3D - Three.js</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020204;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #image-source-list {
      display: none;
    }
  </style>
</head>
<body>

  <div id="image-source-list"></div>
  <div id="webgl-canvas"></div>

  <!-- Bibliotecas externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    // 1. Variáveis com let
    let textures = [];
    let currentIndex = 0;
    let isAnimating = false;
    let autoPlayTimer = null;
    const loader = new THREE.TextureLoader();

    // 2. Setup Three.js
    const container = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    const cameraDistance = 5.0;
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, cameraDistance);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 3. Dimensões do plano focal da câmera
    function getViewportSize(depth, cam) {
      const vFov = (cam.fov * Math.PI) / 180;
      const height = 2 * Math.tan(vFov / 2) * depth;
      const width = height * cam.aspect;
      return { width, height };
    }

    let vp = getViewportSize(cameraDistance, camera);

    // Plano de fundo contínuo
    const bgGeom = new THREE.PlaneGeometry(vp.width, vp.height);
    const bgMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 1.0
    });
    const bgMesh = new THREE.Mesh(bgGeom, bgMat);
    bgMesh.position.set(0, 0, -0.05);
    bgMesh.visible = false;
    scene.add(bgMesh);

    // 4. Montagem das Facetas do Caleidoscópio 3D
    const kaleidoscopeGroup = new THREE.Group();
    kaleidoscopeGroup.visible = false;
    scene.add(kaleidoscopeGroup);

    let facets = [];
    const numRings = 4;

    const matCurrent = new THREE.MeshBasicMaterial({
      map: null,
      side: THREE.DoubleSide
    });

    const matNext = new THREE.MeshBasicMaterial({
      map: null,
      side: THREE.DoubleSide
    });

    function buildKaleidoscope() {
      while (kaleidoscopeGroup.children.length > 0) {
        const obj = kaleidoscopeGroup.children[0];
        kaleidoscopeGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
      }
      facets = [];

      const maxRadius = Math.max(vp.width, vp.height) * 0.75;

      for (let r = 1; r <= numRings; r++) {
        const ringRadiusInner = (r - 1) * (maxRadius / numRings);
        const ringRadiusOuter = r * (maxRadius / numRings);
        const segments = r * 8;

        for (let s = 0; s < segments; s++) {
          const angleStart = (s / segments) * Math.PI * 2;
          const angleEnd = ((s + 1) / segments) * Math.PI * 2;

          const geom = new THREE.BufferGeometry();

          const p0 = new THREE.Vector3(Math.cos(angleStart) * ringRadiusInner, Math.sin(angleStart) * ringRadiusInner, 0);
          const p1 = new THREE.Vector3(Math.cos(angleEnd) * ringRadiusInner, Math.sin(angleEnd) * ringRadiusInner, 0);
          const p2 = new THREE.Vector3(Math.cos(angleStart) * ringRadiusOuter, Math.sin(angleStart) * ringRadiusOuter, 0);
          const p3 = new THREE.Vector3(Math.cos(angleEnd) * ringRadiusOuter, Math.sin(angleEnd) * ringRadiusOuter, 0);

          const vertices = new Float32Array([
            p0.x, p0.y, p0.z,
            p1.x, p1.y, p1.z,
            p2.x, p2.y, p2.z,
            p1.x, p1.y, p1.z,
            p3.x, p3.y, p3.z,
            p2.x, p2.y, p2.z
          ]);

          const toUv = (pt) => [
            (pt.x + vp.width / 2) / vp.width,
            (pt.y + vp.height / 2) / vp.height
          ];

          const uv0 = toUv(p0);
          const uv1 = toUv(p1);
          const uv2 = toUv(p2);
          const uv3 = toUv(p3);

          const uvs = new Float32Array([
            uv0[0], uv0[1],
            uv1[0], uv1[1],
            uv2[0], uv2[1],
            uv1[0], uv1[1],
            uv3[0], uv3[1],
            uv2[0], uv2[1]
          ]);

          geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
          geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

          const mesh = new THREE.Mesh(geom, matCurrent);

          const centroidX = (p0.x + p1.x + p2.x + p3.x) / 4;
          const centroidY = (p0.y + p1.y + p2.y + p3.y) / 4;

          mesh.userData = {
            baseX: centroidX,
            baseY: centroidY,
            distFromCenter: Math.sqrt(centroidX * centroidX + centroidY * centroidY),
            angle: angleStart
          };

          kaleidoscopeGroup.add(mesh);
          facets.push(mesh);
        }
      }
    }

    buildKaleidoscope();

    // 5. Transição com GSAP
    function nextSlide() {
      if (isAnimating || !textures.length || textures.length < 2) return;
      isAnimating = true;

      const nextIndex = (currentIndex + 1) % textures.length;

      matNext.map = textures[nextIndex];
      matNext.needsUpdate = true;

      const maxDist = Math.max(...facets.map(f => f.userData.distFromCenter));

      const tl = gsap.timeline({
        onComplete: () => {
          matCurrent.map = textures[nextIndex];
          matCurrent.needsUpdate = true;

          bgMat.map = textures[nextIndex];
          bgMat.needsUpdate = true;

          facets.forEach(f => {
            f.material = matCurrent;
            f.position.set(0, 0, 0);
            f.rotation.set(0, 0, 0);
            f.scale.set(1, 1, 1);
          });

          currentIndex = nextIndex;
          isAnimating = false;
        }
      });

      facets.forEach(f => {
        const delay = (f.userData.distFromCenter / maxDist) * 0.45;

        tl.to(f.position, {
          z: 0.8 + Math.random() * 0.4,
          x: f.userData.baseX * 0.08,
          y: f.userData.baseY * 0.08,
          duration: 0.85,
          ease: "power2.out"
        }, delay);

        tl.to(f.rotation, {
          z: Math.PI * 0.25 * (f.userData.distFromCenter * 0.1),
          x: (Math.random() - 0.5) * 0.3,
          y: (Math.random() - 0.5) * 0.3,
          duration: 0.85,
          ease: "power2.out"
        }, delay);

        tl.to(f.scale, {
          x: 0.92,
          y: 0.92,
          duration: 0.85,
          ease: "power2.out"
        }, delay);

        tl.add(() => {
          f.material = matNext;
        }, delay + 0.85);

        tl.to(f.position, {
          x: 0,
          y: 0,
          z: 0,
          duration: 0.95,
          ease: "back.out(1.15)"
        }, delay + 0.85);

        tl.to(f.rotation, {
          x: 0,
          y: 0,
          z: 0,
          duration: 0.95,
          ease: "power2.inOut"
        }, delay + 0.85);

        tl.to(f.scale, {
          x: 1,
          y: 1,
          duration: 0.95,
          ease: "power2.inOut"
        }, delay + 0.85);
      });
    }

    // 6. Redimensionamento Responsivo
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      vp = getViewportSize(cameraDistance, camera);

      bgMesh.geometry.dispose();
      bgMesh.geometry = new THREE.PlaneGeometry(vp.width, vp.height);

      buildKaleidoscope();
    });

    // 7. Loop de Renderização
    let targetCameraX = 0;
    let targetCameraY = 0;

    window.addEventListener('mousemove', (e) => {
      const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      targetCameraX = mouseX * 0.15;
      targetCameraY = mouseY * 0.1;
    });

    function render() {
      requestAnimationFrame(render);

      camera.position.x += (targetCameraX - camera.position.x) * 0.05;
      camera.position.y += (targetCameraY - camera.position.y) * 0.05;
      camera.lookAt(0, 0, 0);

      if (bgMesh.visible) {
        renderer.render(scene, camera);
      }
    }
    render();

    // --- PADRÃO UNIVERSAL DE RECEBIMENTO DE FOTOS ---
    function aplicarFotos(listaFotos) {
      if (!listaFotos || !listaFotos.length) return;

      const fotosParaUsar = listaFotos.length === 1 ? [listaFotos[0], listaFotos[0]] : listaFotos;

      textures = fotosParaUsar.map(url => {
        const tex = loader.load(url);
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        return tex;
      });

      currentIndex = 0;
      isAnimating = false;

      matCurrent.map = textures[0];
      matCurrent.needsUpdate = true;

      matNext.map = textures[1] || textures[0];
      matNext.needsUpdate = true;

      bgMat.map = textures[0];
      bgMat.needsUpdate = true;

      bgMesh.visible = true;
      kaleidoscopeGroup.visible = true;

      clearInterval(autoPlayTimer);
      if (textures.length > 1) {
        autoPlayTimer = setInterval(nextSlide, 3500);
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.tipo === 'CARREGAR_FOTOS') {
        aplicarFotos(event.data.fotos);
      }
    });

    window.atualizarTexturas = function(novosLinks) {
      aplicarFotos(novosLinks);
    };

    window.parent.postMessage({ tipo: 'IFRAME_PRONTO' }, '*');
  </script>
</body>
</html>
