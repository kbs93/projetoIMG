<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Túnel Hiperespacial 3D - Three.js</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #image-source-list {
      display: none;
    }
  </style>
</head>
<body>

  <div id="image-source-list"></div>
  <div id="webgl-canvas"></div>

  <!-- Bibliotecas externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    // 1. Variáveis com let
    let textures = [];
    let currentIndex = 0;
    let isAnimating = false;
    let autoPlayTimer = null;
    const loader = new THREE.TextureLoader();

    // 2. Setup Three.js
    const container = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    const cameraDistance = 5.0;
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, cameraDistance);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 3. Dimensões do plano focal da câmara para cobertura 100%
    function getViewportSize(depth, cam) {
      const vFov = (cam.fov * Math.PI) / 180;
      const height = 2 * Math.tan(vFov / 2) * depth;
      const width = height * cam.aspect;
      return { width, height };
    }

    let vp = getViewportSize(cameraDistance, camera);

    // 4. Montagem das Camadas do Túnel 3D
    let geom = new THREE.PlaneGeometry(vp.width, vp.height, 40, 40);

    const matCurrent = new THREE.MeshBasicMaterial({
      map: null,
      transparent: true,
      side: THREE.DoubleSide
    });

    const matNext = new THREE.MeshBasicMaterial({
      map: null,
      transparent: true,
      side: THREE.DoubleSide
    });

    const meshCurrent = new THREE.Mesh(geom, matCurrent);
    meshCurrent.position.set(0, 0, 0);
    meshCurrent.visible = false;
    scene.add(meshCurrent);

    const meshNext = new THREE.Mesh(geom, matNext);
    meshNext.position.set(0, 0, -8.0);
    meshNext.scale.set(0.15, 0.15, 1);
    meshNext.material.opacity = 0;
    meshNext.visible = false;
    scene.add(meshNext);

    // Partículas de hiperespaço
    const starCount = 600;
    const starGeom = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      const rad = 2.5 + Math.random() * 3.5;
      const ang = Math.random() * Math.PI * 2;
      starPos[i * 3 + 0] = Math.cos(ang) * rad;
      starPos[i * 3 + 1] = Math.sin(ang) * rad;
      starPos[i * 3 + 2] = (Math.random() - 0.5) * 20.0;
    }

    starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0x8899bb,
      size: 0.05,
      transparent: true,
      opacity: 0.3
    });
    const starField = new THREE.Points(starGeom, starMat);
    scene.add(starField);

    // 5. Transição Automática
    function nextSlide() {
      if (isAnimating || !textures.length || textures.length < 2) return;
      isAnimating = true;

      const nextIndex = (currentIndex + 1) % textures.length;
      matNext.map = textures[nextIndex];
      matNext.needsUpdate = true;

      meshNext.position.set(0, 0, -8.0);
      meshNext.scale.set(0.12, 0.12, 1);
      meshNext.rotation.z = Math.PI * 0.4;
      meshNext.material.opacity = 0;
      meshNext.visible = true;

      const tl = gsap.timeline({
        onComplete: () => {
          matCurrent.map = textures[nextIndex];
          matCurrent.needsUpdate = true;

          meshCurrent.position.set(0, 0, 0);
          meshCurrent.scale.set(1, 1, 1);
          meshCurrent.rotation.z = 0;
          meshCurrent.material.opacity = 1;

          meshNext.position.set(0, 0, -8.0);
          meshNext.material.opacity = 0;

          currentIndex = nextIndex;
          isAnimating = false;
        }
      });

      tl.to(meshCurrent.position, {
        z: 3.5,
        duration: 1.4,
        ease: "power3.in"
      }, 0);

      tl.to(meshCurrent.scale, {
        x: 2.8,
        y: 2.8,
        duration: 1.4,
        ease: "power3.in"
      }, 0);

      tl.to(meshCurrent.rotation, {
        z: -Math.PI * 0.3,
        duration: 1.4,
        ease: "power2.in"
      }, 0);

      tl.to(meshCurrent.material, {
        opacity: 0,
        duration: 0.5,
        ease: "power1.in"
      }, 0.9);

      tl.to(meshNext.material, {
        opacity: 1,
        duration: 0.4,
        ease: "power1.out"
      }, 0.4);

      tl.to(meshNext.position, {
        z: 0.0,
        duration: 1.5,
        ease: "power4.out"
      }, 0.3);

      tl.to(meshNext.scale, {
        x: 1.0,
        y: 1.0,
        duration: 1.5,
        ease: "power4.out"
      }, 0.3);

      tl.to(meshNext.rotation, {
        z: 0.0,
        duration: 1.5,
        ease: "power4.out"
      }, 0.3);

      tl.to(starMat, {
        opacity: 0.9,
        duration: 0.5,
        yoyo: true,
        repeat: 1
      }, 0.4);
    }

    // 6. Redimensionamento Responsivo
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

      vp = getViewportSize(cameraDistance, camera);

      meshCurrent.geometry.dispose();
      meshNext.geometry.dispose();

      geom = new THREE.PlaneGeometry(vp.width, vp.height, 40, 40);
      meshCurrent.geometry = geom;
      meshNext.geometry = geom;
    });

    // 7. Loop de Renderização
    function render() {
      requestAnimationFrame(render);
      starField.rotation.z += 0.002;
      if (meshCurrent.visible) {
        renderer.render(scene, camera);
      }
    }
    render();

    // --- PADRÃO UNIVERSAL DE RECEBIMENTO DE FOTOS ---
    function aplicarFotos(listaFotos) {
      if (!listaFotos || !listaFotos.length) return;

      const fotosParaUsar = listaFotos.length === 1 ? [listaFotos[0], listaFotos[0]] : listaFotos;

      textures = fotosParaUsar.map(url => {
        const tex = loader.load(url);
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        return tex;
      });

      currentIndex = 0;
      isAnimating = false;

      matCurrent.map = textures[0];
      matCurrent.needsUpdate = true;
      matCurrent.opacity = 1;

      matNext.map = textures[1] || textures[0];
      matNext.needsUpdate = true;

      meshCurrent.visible = true;

      clearInterval(autoPlayTimer);
      if (textures.length > 1) {
        autoPlayTimer = setInterval(nextSlide, 3500);
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.tipo === 'CARREGAR_FOTOS') {
        aplicarFotos(event.data.fotos);
      }
    });

    window.atualizarTexturas = function(novosLinks) {
      aplicarFotos(novosLinks);
    };

    window.parent.postMessage({ tipo: 'IFRAME_PRONTO' }, '*');
  </script>
</body>
</html>
